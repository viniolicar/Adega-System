<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Adega System</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell login-shell">
    <div class="login-card">
      <img src="img/adega_logo.jpg" alt="Logo ADEGA" class="login-logo">
      <h1 class="login-title">ADEGA PC</h1>
      <p class="login-subtitle">Entre com sua conta de funcionário</p>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="seuemail@exemplo.com">
        </div>
        <div class="form-group">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <p id="login-error" class="login-error" style="display:none;"></p>
        <button type="submit" id="btn-login" class="btn primary" style="width:100%;">ENTRAR</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
