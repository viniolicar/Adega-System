<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Adega System</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#161616">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Adega PC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
  <script src="js/pwa.js"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell login-shell">
    <div class="login-card">
      <img src="img/adega_logo.jpg" alt="Logo ADEGA" class="login-logo">
      <h1 class="login-title">ADEGA PC</h1>
      <p class="login-subtitle">Entre com sua conta de funcionário</p>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="seuemail@exemplo.com">
        </div>
        <div class="form-group">
          <label for="login-password">Senha</label>
          <div class="password-field">
            <input type="password" id="login-password" required placeholder="••••••••">
            <button type="button" id="btn-toggle-password" class="password-toggle" aria-label="Mostrar senha">
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5c2.4 3.6 5.6 5.5 9.5 5.5s7.1-1.9 9.5-5.5"/><path d="M6 13.2 4.3 15.8M12 15v3M18 13.2l1.7 2.6"/></svg>
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <p id="login-error" class="login-error" style="display:none;"></p>
        <button type="submit" id="btn-login" class="btn primary" style="width:100%;">ENTRAR</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
