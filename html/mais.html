<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mais - Adega System</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#161616">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Adega PC">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="../img/icons/icon-192.png">
    <link rel="apple-touch-icon" href="../img/icons/apple-touch-icon.png">
    <script src="../js/pwa.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../js/supabaseClient.js"></script>
    <script src="../js/authGuard.js"></script>
    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="app-shell">

        <!-- CABEÇALHO -->
        <header class="stock-header">
            <a href="../index.html" class="back-button">←</a>
            <div class="header-info">
                <div class="brand-with-logo">
                    <img src="../img/adega_logo.jpg" alt="Logo ADEGA" class="brand-logo">
                    <span class="brand">ADEGA PC</span>
                </div>
                <h1>Mais</h1>
            </div>
        </header>

        <!-- CONTEÚDO -->
        <main class="app-main">

            <!-- PERFIL -->
            <div class="product-card">
                <div class="profile-card-top">
                    <div class="profile-avatar">👤</div>
                    <div>
                        <div class="profile-name" id="profile-name">Carregando...</div>
                        <div class="profile-role" id="profile-role"></div>
                    </div>
                </div>
                <button type="button" id="btn-logout" class="btn-cancel" style="width: 100%; margin-top: 16px;">SAIR</button>
            </div>

            <!-- OBSERVAÇÕES -->
            <h2 class="mais-section-title">Observações</h2>
            <div class="product-card observations-card">
                Produtos, estoque e pedidos agora ficam salvos num banco de dados compartilhado — qualquer
                funcionário logado, em qualquer celular, vê os mesmos dados em tempo real.
            </div>

            <!-- MODO DE EXIBIÇÃO -->
            <h2 class="mais-section-title">Modo de exibição</h2>
            <div class="product-card">
                <button type="button" id="theme-toggle" class="theme-toggle" role="switch" aria-checked="true" aria-label="Alternar tema">
                    <span class="theme-toggle-thumb" aria-hidden="true">
                        <span class="theme-toggle-icon">☾</span>
                    </span>
                    <span class="theme-toggle-label">MODO ESCURO</span>
                </button>
            </div>

            <!-- PRODUTOS COM ESTOQUE BAIXO -->
            <h2 class="mais-section-title">Produtos com estoque baixo</h2>
            <div class="product-card">
                <div id="low-stock-list"></div>
            </div>

        </main>

        <!-- MENU INFERIOR -->
        <nav class="bottom-nav">
            <a href="../index.html" class="nav-item">
                🏠
                <span>Início</span>
            </a>
            <a href="pedidos.html" class="nav-item">
                📋
                <span>Pedidos</span>
            </a>
            <a href="estoque.html" class="nav-item">
                📦
                <span>Estoque</span>
            </a>
            <a href="mais.html" class="nav-item active">
                ⚙️
                <span>Mais</span>
            </a>
        </nav>

    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/data/productManager.js"></script>
    <script src="../js/pages/mais.js"></script>

</body>

</html>
