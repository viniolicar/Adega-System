<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adega System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-with-logo">
        <img src="img/adega_logo.jpg" alt="Logo ADEGA" class="brand-logo">
        <span class="brand">ADEGA PC</span>
      </div>
      <div class="greeting">Olá, Funcionário 👋</div>
    </header>

    <main class="app-main">
      <button id="new-order" class="btn primary">+ CRIAR PEDIDO</button>
    </main>

    <!-- MODAL DE CRIAÇÃO DE PEDIDO -->
    <div class="modal" id="order-modal">
      <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">
          <h2 id="order-modal-title">Criar Pedido</h2>
        </div>

        <div id="order-modal-body">
          <!-- Passo 1: Seleção de produtos -->
          <div id="order-step-products">
            <div class="form-group">
              <label for="order-product-select">Selecione um produto *</label>
              <select id="order-product-select" required>
                <option value="">Escolha um produto...</option>
              </select>
            </div>

            <div class="form-group">
              <label for="order-product-qty">Quantidade *</label>
              <input 
                type="number" 
                id="order-product-qty" 
                min="1" 
                value="1" 
                required
              >
            </div>

            <button type="button" id="btn-add-to-order" class="btn primary" style="width: 100%; margin-bottom: 16px;">
              ADICIONAR AO PEDIDO
            </button>

            <div id="order-items-list" style="margin: 20px 0; padding: 16px; background: #f9fafb; border-radius: 10px; min-height: 50px;">
              <p style="text-align: center; color: var(--muted); font-size: 13px;">Nenhum item adicionado ainda</p>
            </div>

            <div id="order-total-area" style="display: none; padding: 12px; background: #f1f3f6; border-radius: 10px; margin: 16px 0;">
              <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 16px;">
                <span>Total:</span>
                <span id="order-total">R$ 0,00</span>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="btn-cancel-order">CANCELAR</button>
          <button type="button" class="btn-submit" id="btn-finalize-order" style="display: none;">FINALIZAR PEDIDO</button>
        </div>
      </div>
    </div>

    <nav class="bottom-nav" role="navigation" aria-label="Navegação principal">
      <button class="nav-item active">🏠<span>Início</span></button>
      <a href="html/pedidos.html" class="nav-item">📋<span>Pedidos</span></a>
      <a href="html/estoque.html" class="nav-item">📦<span>Estoque</span></a>
      <button class="nav-item">⚙️<span>Mais</span></button>
    </nav>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/data/productManager.js"></script>
  <script src="js/data/orderManager.js"></script>
  <script src="js/pages/index.js"></script>
</body>
</html>
